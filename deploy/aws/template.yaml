AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenVPS on a single on-demand GPU EC2 instance. Runs the upstream
  docker-compose.yaml unmodified, with AWS-specific changes applied as a Compose
  override. Access is by SSM Session Manager only; there is no key pair and no SSH
  ingress. Secrets live in Secrets Manager and are fetched at boot by the instance role.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Variant}
        Parameters: [Variant, DdsPeers]
      - Label: {default: Placement}
        Parameters: [VpcId, SubnetId]
      - Label: {default: Instance}
        Parameters: [InstanceType, RootVolumeSize, MapsVolumeSize, AttachElasticIp]
      - Label: {default: Application}
        Parameters: [SecretsManagerArn, DomainName, DefaultLongitude, DefaultLatitude]
      - Label: {default: Upstream pins}
        Parameters: [UpstreamRepo, UpstreamRef, HlocRepo, HlocCommit]
    ParameterLabels:
      SubnetId: {default: 'Public subnet (also fixes the AZ for the maps volume, permanently)'}
      Variant: {default: 'Which OpenVPS to deploy (geopose is the default and is unchanged)'}

Parameters:

  Variant:
    Type: String
    Default: geopose
    AllowedValues: [geopose, spatialdds]
    Description: >-
      `geopose` is the GeoPose Protocol service on openvps:main, and is what this template
      deployed before the variant existed. `spatialdds` is the SpatialDDS 1.7 VPS binding
      on the openvps:spatialdds branch. The variant selects the upstream ref and the
      Compose overrides; sizing, storage, idle shutdown and the waker are shared. See the
      VariantConfig mapping — neither variant tracks a moving branch.

  DdsPeers:
    Type: String
    Default: ''
    Description: >-
      spatialdds only, optional. Space-separated unicast DDS peers, e.g. `udp/10.0.1.42`.
      A VPC carries no multicast, so cross-instance RTPS discovery must be unicast. Leave
      empty for a single host, where loopback discovery needs no peers.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the instance and both security groups.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      A PUBLIC subnet (needs a route to an internet gateway; there is deliberately no NAT
      gateway). This choice is effectively permanent: the retained maps volume is bound to
      this subnet's AZ, so the instance can never move to another AZ without copying data
      via a snapshot. Pick an AZ with reliable g6 capacity — see README.

  InstanceType:
    Type: String
    Default: g4dn.2xlarge
    AllowedValues:
      - g4dn.xlarge
      - g4dn.2xlarge
      - g5.xlarge
      - g5.2xlarge
      - g6.xlarge
      - g6.2xlarge
      - g6.4xlarge
      - g6e.xlarge
      - g6e.2xlarge
    Description: >-
      Pick on availability first, not on GPU. Measured peak VRAM is 3.8 GiB, so every type
      here is heavily over-provisioned on GPU, and the workload is CPU-bound — which makes
      vCPU count and whether the type can actually be launched the things that matter.
      A capacity probe across us-east-1 found g4dn.2xlarge in 5 of 5 AZs, g5.2xlarge in 3,
      and g6.2xlarge in 1, with g4dn.2xlarge also 23% cheaper than g6.2xlarge at the same
      8 vCPU / 32 GiB. Re-probe before choosing; see the README. Resizing later is a
      stop / modify / start in the pinned AZ, so that AZ needs capacity for whichever
      types you may want.

  RootVolumeSize:
    Type: Number
    Default: 200
    MinValue: 150
    MaxValue: 1000
    Description: >-
      gp3 root, GiB. Measured, not guessed: the Deep Learning AMI occupies 50 GB before
      anything is built, steady state after building all four images is 112 GB, and an
      in-place rebuild transiently needs ~71 GB more of build cache. Below 150 there is no
      room to rebuild; below 75 the AMI itself will not fit.

  MapsVolumeSize:
    Type: Number
    Default: 200
    MinValue: 20
    MaxValue: 16384
    Description: gp3 data volume for MY_SHARED_MAPS_DIR, GiB. Retained on stack deletion.

  AttachElasticIp:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Default false on purpose. The GPU instance does not need a stable public address:
      the waker reaches it over the VPC by private IP, which already survives stop/start,
      and outbound access for image pulls comes from the subnet's auto-assigned public IP.
      Reserve the Elastic IP for the waker, which is what DNS points at. Set true only if
      you need to reach this instance directly from the internet.

  SecretsManagerArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+$'
    Description: >-
      ARN of a Secrets Manager secret holding a JSON object with keys AUTH_SECRET,
      AUTH_FUSIONAUTH_ID, AUTH_FUSIONAUTH_SECRET and optionally AUTH_FUSIONAUTH_ISSUER.
      Never place these values in this template, in parameters, or in user-data.

  DomainName:
    Type: String
    Default: ''
    Description: >-
      Public base domain, e.g. vps.cloudpose.io. Used to build the public service URLs the
      containers advertise, and which FusionAuth's redirect URLs must match exactly. Leave
      empty to fall back to sslip.io against the waker address.

  IdleShutdownMinutes:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 1440
    Description: >-
      Stop the instance after this many minutes with no GPU compute process, no off-box
      connection to a service port, no non-loopback HTTP request, and no write under the
      maps directory. 0 disables idle shutdown.

  DefaultLongitude:
    Type: String
    Default: '0'
  DefaultLatitude:
    Type: String
    Default: '0'

  UpstreamRepo:
    Type: String
    Default: https://github.com/OpenArCloud/openvps.git
  UpstreamRef:
    Type: String
    Default: ''
    Description: >-
      Override the variant's pinned upstream commit. Leave empty (the normal case) to take
      the ref from the VariantConfig mapping. Set only to test a specific commit, and give
      a commit hash, not a branch.
  HlocRepo:
    Type: String
    Default: https://github.com/cvg/Hierarchical-Localization.git
  HlocCommit:
    Type: String
    Default: c13273b
    Description: >-
      Not a free choice. Both upstream Dockerfiles hardcode pycolmap==3.13, and c13273b
      (2025-12-10) is the only listed HLOC commit compatible with it.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id
    Description: Resolved from the SSM public parameter rather than hardcoded.

Mappings:

  # Everything that differs between the variants, in one table: adding a variant is a row
  # here plus a Compose override. Refs are commit hashes, never branch names — a branch
  # would let two deployments of the "same" stack run different software unrecorded.
  VariantConfig:
    geopose:
      # openvps:main. Unchanged, so a defaults stack matches one created before variants.
      UpstreamRef: fc2f4706f8cd0340b22685aa67c4a9d63837f3f6
      ComposeFiles: '-f docker-compose.yaml -f /opt/openvps/docker-compose.aws.yaml'
      IdleExtraPorts: ''
      IdleExtraContainers: ''
    spatialdds:
      # openvps:spatialdds. No implementation on the branch yet, so this is the same commit
      # as geopose and the variants differ only by the Compose override. Bump per checkpoint.
      UpstreamRef: fc2f4706f8cd0340b22685aa67c4a9d63837f3f6
      ComposeFiles: '-f docker-compose.yaml -f /opt/openvps/docker-compose.aws.yaml -f /opt/openvps/docker-compose.spatialdds.yaml'
      # The web bridge's WebSocket port, so a connected browser client counts as activity.
      IdleExtraPorts: '8088'
      IdleExtraContainers: 'openvps-webbridge-1'

Conditions:
  WantElasticIp: !Equals [!Ref AttachElasticIp, 'true']
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  IsSpatialDds: !Equals [!Ref Variant, 'spatialdds']
  HasUpstreamRefOverride: !Not [!Equals [!Ref UpstreamRef, '']]

Resources:

  # ------------------------------------------------------------------ networking

  # Created here, with no instance attached yet, so the GPU security group can name it as
  # its only ingress source. Phase 4 launches the waker into this group.
  WakerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: openvps-aws waker (Caddy). Holds the domain and terminates TLS.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: HTTP - ACME challenge and redirect}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
      Tags:
        - {Key: Project, Value: openvps-aws}
        - {Key: Name, Value: !Sub '${AWS::StackName}-waker'}

  GpuSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        openvps-aws GPU host. Inbound from the waker only; no SSH, no key pair. Management
        is via SSM Session Manager, which is outbound-initiated.
      VpcId: !Ref VpcId
      Tags:
        - {Key: Project, Value: openvps-aws}
        - {Key: Name, Value: !Sub '${AWS::StackName}-gpu'}

  # Separate resources rather than inline rules, to avoid a circular dependency between
  # the two groups.
  GpuIngressHttp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GpuSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref WakerSecurityGroup
      Description: MapBuilder frontend, from the waker only

  GpuIngressMapAligner:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GpuSecurityGroup
      IpProtocol: tcp
      FromPort: 3001
      ToPort: 3001
      SourceSecurityGroupId: !Ref WakerSecurityGroup
      Description: MapAligner, from the waker only

  GpuIngressFusionAuth:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GpuSecurityGroup
      IpProtocol: tcp
      FromPort: 9011
      ToPort: 9011
      SourceSecurityGroupId: !Ref WakerSecurityGroup
      Description: FusionAuth, from the waker only

  GpuIngressMapLocalizer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GpuSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref WakerSecurityGroup
      Description: MapLocalizer, from the waker only

  # --- spatialdds variant only ---------------------------------------------------------

  GpuIngressWebBridge:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsSpatialDds
    Properties:
      GroupId: !Ref GpuSecurityGroup
      IpProtocol: tcp
      FromPort: 8088
      ToPort: 8088
      SourceSecurityGroupId: !Ref WakerSecurityGroup
      Description: SpatialDDS web bridge (HTTP + WS), from the waker only

  # RTPS between GPU hosts, for the two-instance discovery test. Source is this group
  # itself, so it covers members and nothing outside. 7400-7500 is Cyclone's default range;
  # TCP is here for deployments that fall back to Cyclone's TCP transport.
  GpuIngressRtpsUdp:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsSpatialDds
    Properties:
      GroupId: !Ref GpuSecurityGroup
      IpProtocol: udp
      FromPort: 7400
      ToPort: 7500
      SourceSecurityGroupId: !Ref GpuSecurityGroup
      Description: RTPS discovery and user traffic, within this group only

  GpuIngressRtpsTcp:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsSpatialDds
    Properties:
      GroupId: !Ref GpuSecurityGroup
      IpProtocol: tcp
      FromPort: 7400
      ToPort: 7500
      SourceSecurityGroupId: !Ref GpuSecurityGroup
      Description: RTPS over TCP, between hosts in this group only

  # ------------------------------------------------------------------ identity

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/openvps-aws/${AWS::StackName}'
      RetentionInDays: 30
      Tags:
        - {Key: Project, Value: openvps-aws}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: secrets-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to the one secret. Not secretsmanager:* on *.
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource: !Ref SecretsManagerArn
        - PolicyName: logs-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub '${LogGroup.Arn}:*'
        - PolicyName: read-own-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Reads this stack's Metadata, which carries the config files and unit files.
              # Signalling completion needs no permission at all — it is a PUT to the
              # pre-signed wait-condition handle URL.
              - Effect: Allow
                Action: cloudformation:DescribeStackResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
      Tags:
        - {Key: Project, Value: openvps-aws}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ------------------------------------------------------------------ storage

  # Retained deliberately: deleting the stack must not delete the maps. The consequence is
  # that a re-created stack will NOT pick this volume back up automatically — attach it by
  # hand, or import it. Documented in README teardown.
  MapsVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: !Ref MapsVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - {Key: Project, Value: openvps-aws}
        - {Key: Name, Value: !Sub '${AWS::StackName}-maps'}

  MapsVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref MapsVolume
      Device: /dev/sdf

  # ------------------------------------------------------------------ compute

  ElasticIp:
    Type: AWS::EC2::EIP
    Condition: WantElasticIp
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - {Key: Project, Value: openvps-aws}

  # The bootstrap signal cannot be a CreationPolicy on the instance. MapsVolumeAttachment
  # depends on Instance, so with a CreationPolicy CloudFormation would wait for user-data
  # to signal before attaching the volume — while user-data waits for the volume to
  # appear. That deadlocks until the timeout. A WaitCondition that DependsOn the instance
  # lets the instance reach CREATE_COMPLETE, the volume attach, and user-data proceed.
  BootstrapWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  BootstrapWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Instance
    Properties:
      Handle: !Ref BootstrapWaitHandle
      # First boot clones, builds four images from scratch, and starts them. Phase 1
      # measured 19m45s for the build alone on a g6.xlarge.
      Timeout: '3600'
      Count: 1

  Instance:
    Type: AWS::EC2::Instance
    # GENERATED — populated by deploy/aws/build.py from the files under deploy/aws/.
    # Do not hand-edit the content below; edit the source files and re-run the build.
    Metadata:
      {
        "openvps": {
          "files": {
            "/opt/openvps/nginx/mapbuilder.conf": {
              "mode": "0644",
              "gz64": ""
            },
            "/opt/openvps/docker-compose.aws.yaml": {
              "mode": "0644",
              "gz64": ""
            },
            "/opt/openvps/docker-compose.spatialdds.yaml": {
              "mode": "0644",
              "gz64": ""
            },
            "/opt/openvps/cyclonedds.xml.in": {
              "mode": "0644",
              "gz64": ""
            },
            "/opt/openvps/fusionauth/docker-compose.fusionauth.yaml": {
              "mode": "0644",
              "gz64": ""
            },
            "/opt/openvps/fusionauth/kickstart/kickstart.json": {
              "mode": "0644",
              "gz64": ""
            },
            "/usr/local/bin/openvps-render-env": {
              "mode": "0700",
              "gz64": ""
            },
            "/usr/local/bin/openvps-idle-shutdown": {
              "mode": "0700",
              "gz64": ""
            },
            "/usr/local/bin/openvps-fusionauth-configure": {
              "mode": "0700",
              "gz64": ""
            },
            "/etc/systemd/system/openvps-auth.service": {
              "mode": "0644",
              "gz64": ""
            },
            "/etc/systemd/system/openvps.service": {
              "mode": "0644",
              "gz64": ""
            },
            "/etc/systemd/system/openvps-idle.service": {
              "mode": "0644",
              "gz64": "H4sIAAAAAAACEy2MMQ7CMAwAd7+iHyh5QQYkmEEKsFQdimsUi8iOYrfA7wHBdtLpbjgL+wg7MmxcnVXioZJcjqnjuVCHmfAO25tTi/oRa7WNUVsZCYb0gxFOr0pRhSyrw/5JmHxqHsNiLRTFqYQrS/j3/XfcW1581ofAG9/qUhuCAAAA"
            },
            "/etc/systemd/system/openvps-idle.timer": {
              "mode": "0644",
              "gz64": "H4sIAAAAAAACExWMuwqDQBBF+/2K+YJgCJYWSppUhphHIRbLeIlDdJTdUfDv45b3XM5pXyrWuSsiB1lMZi0eq5INoHqBvu8NST+CeAD/CBvCTjlNoqshuvYpE0Lnaq3m2Rpwcc6O79gpW7LJhkTzBEvmNXjeE7hkh3zTaH4cO/fxauirvbCUiyfz4Qtzf9G8GbKcAAAA"
            }
          }
        }
      }
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref GpuSecurityGroup]
      # No KeyName. Access is SSM Session Manager only.
      PropagateTagsToVolumeOnCreation: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required        # IMDSv2 only
        HttpEndpoint: enabled
      Tags:
        - {Key: Project, Value: openvps-aws}
        - {Key: Name, Value: !Sub '${AWS::StackName}-gpu'}
      UserData:
        Fn::Base64:
          # Two-argument Fn::Sub: the second argument carries the variant-derived values,
          # which Mappings cannot reach through the short form. ${!Var} escapes as before.
          Fn::Sub:
            - |
              #!/bin/bash
              # First-boot provisioning. Runs once; the systemd unit it installs is what brings
              # the stack up on every subsequent boot.
              set -uo pipefail
              exec > >(tee -a /var/log/openvps-bootstrap.log) 2>&1
              echo "=== openvps bootstrap $(date -u) ==="

              STACK='${AWS::StackName}'
              REGION='${AWS::Region}'
              SECRET_ARN='${SecretsManagerArn}'
              UPSTREAM_REPO='${UpstreamRepo}'
              UPSTREAM_REF='${EffectiveUpstreamRef}'
              HLOC_REPO='${HlocRepo}'
              HLOC_COMMIT='${HlocCommit}'
              DOMAIN='${DomainName}'
              DEF_LON='${DefaultLongitude}'
              DEF_LAT='${DefaultLatitude}'
              LOG_GROUP='${LogGroup}'
              WAIT_URL='${BootstrapWaitHandle}'
              IDLE_MIN='${IdleShutdownMinutes}'
              VARIANT='${Variant}'
              COMPOSE_FILES='${ComposeFiles}'
              IDLE_EXTRA_PORTS='${IdleExtraPorts}'
              IDLE_EXTRA_CONTAINERS='${IdleExtraContainers}'
              DDS_PEERS='${DdsPeers}'

              DATA_DIR=/home/ubuntu/data
              MAPS_DIR=/home/ubuntu/data/maps
              FA_DB_DIR=/home/ubuntu/data/fusionauth-db
              BASE=/opt/openvps

              TOKEN="$(curl -sf -X PUT http://169.254.169.254/latest/api/token \
                       -H 'X-aws-ec2-metadata-token-ttl-seconds: 300' || true)"
              IID="$(curl -sf -H "X-aws-ec2-metadata-token: ${!TOKEN}" \
                     http://169.254.169.254/latest/meta-data/instance-id || hostname)"

              signal() {
                curl -sS -X PUT -H 'Content-Type:' --max-time 30 \
                  --data-binary "{\"Status\":\"$1\",\"Reason\":\"$2\",\"UniqueId\":\"${!IID}\",\"Data\":\"$2\"}" \
                  "${!WAIT_URL}" || true
              }
              # Signal FAILURE immediately rather than letting CreationPolicy burn its full
              # 50-minute timeout on a problem we already know about.
              fail() { echo "BOOTSTRAP FAILED: $*"; signal FAILURE "$*"; exit 1; }

              # ---- fail fast on no egress --------------------------------------------------
              # Everything below needs the internet: git clones, base images, pip, apt. There
              # is deliberately no NAT gateway, so this subnet must be public with
              # auto-assign public IPv4 enabled. Catch it in seconds, not in 50 minutes.
              NET_OK=""
              for _ in $(seq 1 18); do
                if curl -sS --max-time 10 -o /dev/null https://github.com 2>/dev/null; then NET_OK=1; break; fi
                sleep 5
              done
              if [ -z "${!NET_OK}" ]; then
                echo "--- network diagnostics ---"
                ip -br addr; ip route; cat /etc/resolv.conf
                getent hosts github.com || echo "DNS lookup failed"
                fail "no outbound internet after 90s - is this subnet public with auto-assign public IPv4 on?"
              fi
              echo "egress OK"

              # ---- data volume ------------------------------------------------------------
              # Device names are not stable on Nitro: /dev/sdf shows up as /dev/nvmeXn1 with an
              # unpredictable index. Identify it as "the whole disk that is not the root disk"
              # — safe because exactly one extra volume is ever attached. Matching on the NVMe
              # serial (which carries the EBS volume id) would be tighter, but referencing
              # MapsVolume here would create a cycle: user-data -> volume -> instance AZ.
              ROOT_PART="$(findmnt -no SOURCE /)"
              ROOT_NAME="$(lsblk -no PKNAME "${!ROOT_PART}" 2>/dev/null || basename "${!ROOT_PART}")"
              echo "root disk is /dev/${!ROOT_NAME}"
              DEV=""
              for _ in $(seq 1 60); do
                # EBS volumes report an NVMe serial of the form "vol0123abc..."; instance-store
                # disks do not. Filtering on that prefix is what keeps us off the ephemeral
                # disk — every g6 ships one (250 GB on xlarge, 450 GB on 2xlarge), and it is
                # wiped on every stop/start, so formatting it would silently destroy the maps.
                while read -r name serial type; do
                  [ "${!type}" = "disk" ] || continue
                  [ "${!name}" = "${!ROOT_NAME}" ] && continue
                  case "${!serial}" in vol*) DEV="/dev/${!name}" ;; esac
                done < <(lsblk -dn -o NAME,SERIAL,TYPE)
                [ -n "${!DEV}" ] && break
                sleep 5
              done
              if [ -z "${!DEV}" ]; then
                echo "--- block devices seen ---"; lsblk -o NAME,SERIAL,TYPE,SIZE,MOUNTPOINT
                fail "maps EBS volume never appeared as a block device"
              fi
              echo "maps volume is ${!DEV}"

              if ! blkid "${!DEV}" >/dev/null 2>&1; then
                echo "no filesystem on ${!DEV}; creating ext4"
                mkfs.ext4 -L openvps-maps "${!DEV}" || fail "mkfs failed"
              else
                echo "existing filesystem found; leaving it alone"
              fi

              UUID="$(blkid -s UUID -o value "${!DEV}")"
              [ -n "${!UUID}" ] || fail "could not read UUID"
              mkdir -p "${!DATA_DIR}"
              # The volume is mounted at /home/ubuntu/data, not directly at the maps directory,
              # so FusionAuth's Postgres can live beside the maps on the same RETAINED volume.
              # That database holds every user account and the OAuth client secret the apps
              # authenticate with; it has to outlive the instance exactly as the maps do.
              # Mount by UUID — device names are not stable across reboots, observed changing
              # from nvme2n1 to nvme1n1 on the first stop/start. nofail so a missing volume
              # degrades to a failed service rather than an unbootable host.
              grep -q "${!UUID}" /etc/fstab || \
                echo "UUID=${!UUID} ${!DATA_DIR} ext4 defaults,nofail,x-systemd.device-timeout=30 0 2" >> /etc/fstab
              systemctl daemon-reload
              mount -a || fail "mount failed"
              mkdir -p "${!MAPS_DIR}" "${!FA_DB_DIR}"
              # The backend runs as uid 1000 inside its container (MY_USER_ID).
              chown 1000:1000 "${!MAPS_DIR}"
              # Postgres runs as uid 70 (alpine). The directory must be owned by that uid BEFORE
              # the container first starts — left root-owned, the entrypoint cannot create its
              # PGDATA subdirectory and the container enters a restart loop that survives fixing
              # the ownership afterwards, because a half-made pgdata is left behind.
              chown 70:70 "${!FA_DB_DIR}"
              chmod 700 "${!FA_DB_DIR}"
              df -h "${!DATA_DIR}"

              # ---- source ------------------------------------------------------------------
              mkdir -p "${!BASE}/nginx"
              if [ ! -d "${!BASE}/openvps/.git" ]; then
                git clone "${!UPSTREAM_REPO}" "${!BASE}/openvps" || fail "clone upstream failed"
                git -C "${!BASE}/openvps" checkout "${!UPSTREAM_REF}" || fail "checkout upstream failed"
                git clone "${!HLOC_REPO}" "${!BASE}/openvps/Hierarchical-Localization" || fail "clone hloc failed"
                git -C "${!BASE}/openvps/Hierarchical-Localization" checkout "${!HLOC_COMMIT}" || fail "checkout hloc failed"
                git -C "${!BASE}/openvps/Hierarchical-Localization" submodule update --init --recursive || fail "hloc submodules failed"
              fi

              # ---- AWS-specific config -----------------------------------------------------
              # Config files, scripts and unit files come from this stack's own Metadata rather
              # than being inlined here. User-data is capped at 16 KB and embedding them all
              # blew through it; Metadata rides in the template, which allows 51 KB. It also
              # means the payloads need no Fn::Sub escaping and stay byte-identical to the
              # readable copies under deploy/aws/ in this repository.
              aws cloudformation describe-stack-resource --region "${!REGION}" \
                --stack-name "${!STACK}" --logical-resource-id Instance \
                --query 'StackResourceDetail.Metadata' --output text > /tmp/openvps-meta.json \
                || fail "could not read stack metadata"

              python3 - <<'WRITEFILES' || fail "writing config files failed"
              import json, os, gzip, base64
              meta = json.load(open('/tmp/openvps-meta.json'))
              for path, spec in meta['openvps']['files'].items():
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  data = gzip.decompress(base64.b64decode(spec['gz64']))
                  with open(path, 'wb') as fh:
                      fh.write(data)
                  os.chmod(path, int(spec['mode'], 8))
                  print(f"  wrote {path} ({len(data)} bytes, mode {spec['mode']})")
              WRITEFILES
              rm -f /tmp/openvps-meta.json
              # Written here rather than fetched, so a first boot needs nothing but this repo's
              # pinned upstream. Comments are stripped; the annotated originals live in
              # deploy/aws/ in the deployment repo.


              # ---- env renderer: runs on every boot, so rotated secrets are picked up -------

              cat > "${!BASE}/bootstrap.conf" <<CONF
              REGION=${!REGION}
              SECRET_ARN=${!SECRET_ARN}
              DOMAIN=${!DOMAIN}
              DEF_LON=${!DEF_LON}
              DEF_LAT=${!DEF_LAT}
              CONF
              chmod 600 "${!BASE}/bootstrap.conf"

              # ---- variant ------------------------------------------------------------------
              # The Compose file list goes in a conf file rather than the systemd unit, so
              # the unit is shared and the variant lives in one place. systemd word-splits
              # $COMPOSE_FILES from an EnvironmentFile, turning this back into flags.
              echo "variant: ${!VARIANT}"
              echo "upstream ref: ${!UPSTREAM_REF}"
              cat > "${!BASE}/compose.conf" <<CONF
              COMPOSE_FILES=${!COMPOSE_FILES}
              CONF

              if [ "${!VARIANT}" = "spatialdds" ]; then
                # A VPC carries no multicast, so RTPS discovery cannot use it. Render the
                # peer list into the Cyclone config; empty peers is correct for a
                # single-host deployment, where discovery over loopback needs none.
                PEER_XML=""
                for peer in ${!DDS_PEERS}; do
                  PEER_XML="${!PEER_XML}<Peer address=\"${!peer}\"/>"
                done
                sed "s|<!--PEERS-->|${!PEER_XML}|" "${!BASE}/cyclonedds.xml.in" \
                  > "${!BASE}/cyclonedds.xml" || fail "rendering cyclonedds.xml failed"
                echo "dds peers: ${!DDS_PEERS:-none (single host)}"
              fi

              # ---- systemd unit: brings the stack up on every boot -------------------------

              systemctl daemon-reload
              systemctl enable openvps-auth.service openvps.service

              # ---- idle shutdown (Phase 3) --------------------------------------------------
              # EXTRA_PORTS/EXTRA_CONTAINERS extend the shared idle detector rather than
              # replacing it; spatialdds adds the web bridge so a browser reads as activity.
              cat > "${!BASE}/idle.conf" <<CONF
              IDLE_MINUTES=${!IDLE_MIN}
              MAPS_DIR=${!MAPS_DIR}
              EXTRA_PORTS=${!IDLE_EXTRA_PORTS}
              EXTRA_CONTAINERS=${!IDLE_EXTRA_CONTAINERS}
              HEARTBEAT_FILE=/var/lib/openvps/last-dds-activity
              CONF



              systemctl daemon-reload
              systemctl enable openvps-idle.timer

              # ---- build ------------------------------------------------------------------
              /usr/local/bin/openvps-render-env || fail "rendering docker.env failed"
              cd "${!BASE}/openvps" || fail "no source dir"
              echo "=== build start $(date -u) ==="
              docker compose ${!COMPOSE_FILES} \
                --env-file "${!BASE}/docker.env" build || fail "docker compose build failed"
              echo "=== build done $(date -u) ==="

              # Reclaim the build cache; Phase 1 measured ~71 GB of it.
              docker builder prune -af || true

              # Start the identity provider first and fail loudly if it does not come up. The
              # apps only Want (not Require) it, so a broken FusionAuth would otherwise let the
              # stack reach CREATE_COMPLETE with login silently non-functional — a false green,
              # which is worse than a failed stack.
              systemctl start openvps-auth.service || {
                echo "--- openvps-auth.service failed; diagnostics ---"
                systemctl status openvps-auth.service --no-pager -l | tail -20 || true
                docker compose -p openvps-auth -f "${!BASE}/fusionauth/docker-compose.fusionauth.yaml" \
                  --env-file "${!BASE}/fusionauth.env" ps || true
                docker logs --tail 30 openvps-auth-db-1 2>&1 | tail -30 || true
                docker logs --tail 30 openvps-auth-fusionauth-1 2>&1 | tail -30 || true
                fail "openvps-auth.service failed to start"
              }
              systemctl start openvps.service || fail "openvps.service failed to start"
              docker compose ${!COMPOSE_FILES} \
                --env-file "${!BASE}/docker.env" ps

              systemctl start openvps-idle.timer || true
              echo "idle shutdown: ${!IDLE_MIN} minutes (0 = disabled)"
              systemctl list-timers openvps-idle.timer --no-pager || true

              echo "=== bootstrap complete $(date -u) ==="
              signal SUCCESS "bootstrap complete"

            - EffectiveUpstreamRef: !If
                - HasUpstreamRefOverride
                - !Ref UpstreamRef
                - !FindInMap [VariantConfig, !Ref Variant, UpstreamRef]
              ComposeFiles: !FindInMap [VariantConfig, !Ref Variant, ComposeFiles]
              IdleExtraPorts: !FindInMap [VariantConfig, !Ref Variant, IdleExtraPorts]
              IdleExtraContainers: !FindInMap [VariantConfig, !Ref Variant, IdleExtraContainers]

Outputs:
  InstanceId:
    Value: !Ref Instance
    Export: {Name: !Sub '${AWS::StackName}-InstanceId'}
  PrivateIp:
    Description: Stable across stop/start. This is what the waker should proxy to.
    Value: !GetAtt Instance.PrivateIp
    Export: {Name: !Sub '${AWS::StackName}-PrivateIp'}
  AvailabilityZone:
    Description: Fixed for the life of the maps volume.
    Value: !GetAtt Instance.AvailabilityZone
  WakerSecurityGroupId:
    Description: Launch the Phase 4 waker into this group; it is the GPU host's only ingress source.
    Value: !Ref WakerSecurityGroup
    Export: {Name: !Sub '${AWS::StackName}-WakerSecurityGroupId'}
  MapsVolumeId:
    Description: Retained on stack deletion. Re-attach by hand if the stack is recreated.
    Value: !Ref MapsVolume
  ElasticIp:
    Condition: WantElasticIp
    Value: !Ref ElasticIp
  PublicUrlBase:
    Condition: HasDomain
    Value: !Sub 'https://build.${DomainName}'
  SessionManagerCommand:
    Value: !Sub 'aws ssm start-session --region ${AWS::Region} --target ${Instance}'
  BootstrapLog:
    Value: /var/log/openvps-bootstrap.log
  IdleShutdownMinutes:
    Value: !Ref IdleShutdownMinutes
  Variant:
    Value: !Ref Variant
  UpstreamRefDeployed:
    Description: The commit actually cloned, after variant selection and any override.
    Value: !If
      - HasUpstreamRefOverride
      - !Ref UpstreamRef
      - !FindInMap [VariantConfig, !Ref Variant, UpstreamRef]
  WebBridgeEndpoint:
    Condition: IsSpatialDds
    Description: >-
      Reachable from the waker security group only. Needs a Caddy route on the waker before
      a browser can use it — see README, "The spatialdds variant".
    Value: !Sub 'http://${Instance.PrivateIp}:8088'
