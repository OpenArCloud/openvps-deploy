# Derived from upstream mapbuilder/Frontend/nginx.conf at b2dff1f, mounted over
# /etc/nginx/conf.d/default.conf by docker-compose.aws.yaml.
#
# Re-derive this file whenever upstream changes its nginx.conf. Everything except the
# differences listed below is upstream's, kept byte-for-byte so the diff stays readable.
#
# Three deliberate differences:
#
#   * client_max_body_size 0 — unlimited. Upstream caps at 5000M, which silently rejects
#     StrayScanner recordings over 5 GB. The backend imposes no cap of its own: it streams
#     through connect-busboy with no `limits` configured.
#   * No TLS server block. Caddy on the waker terminates TLS, so upstream's self-signed
#     cert is neither needed nor wanted here.
#   * No file-based access log. Upstream also writes
#     /var/log/nginx/mapbuilder-access.log, which grows without bound inside the container
#     unless someone bind-mounts it. Logging to stdout only keeps it in `docker logs`,
#     where the Phase 3 idle detector reads it, and lets docker's own rotation cap it.

server {
    listen       80;
    server_name  _;

    # `main` is defined in the image's /etc/nginx/nginx.conf and begins with $remote_addr,
    # which is what lets the idle detector filter out loopback healthcheck traffic.
    access_log /dev/stdout main;

    ## Keep alive timeout set to a greater value for SSL/TLS.
    keepalive_timeout 75 75;

    # Uploads are multi-GB StrayScanner zips. 0 disables the check entirely; the backend
    # streams to disk, so nginx must not buffer or bound the body.
    client_max_body_size 0;
    proxy_request_buffering off;

    # A multi-GB upload over a slow link needs generous timeouts.
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    client_body_timeout   3600s;

    location / {
        root   /app;
        index  index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /socket.io/ {
        # Upstream turns access logging off here; the status channel would otherwise flood
        # the log. Note for Phase 3: socket.io traffic is therefore invisible to the idle
        # detector, so a user watching a build produces no log lines. The GPU-process and
        # maps-write conditions are what cover that case.
        access_log off;
        proxy_pass   http://backend:3000/socket.io/;
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /maps/ {
        proxy_pass   http://backend:3000/maps/;
        proxy_pass_request_headers on;
    }

    location /maps {
        proxy_pass   http://backend:3000/maps;
        proxy_pass_request_headers on;
    }

    location /uploadStrayRecordingZip {
        proxy_pass   http://backend:3000;
        proxy_pass_request_headers on;
    }

    location /auth/ {
        proxy_pass   http://backend:3000/auth/;
        proxy_set_header Host $http_host; # Correct hostname for Auth.JS callbacks
    }
}
