# Replacement for mapbuilder/Frontend/nginx.conf, mounted over
# /etc/nginx/conf.d/default.conf by docker-compose.aws.yaml.
#
# Two deliberate differences from upstream:
#
#   * client_max_body_size 0 — unlimited. Upstream caps at 5000M, which silently
#     rejects StrayScanner recordings larger than 5 GB. The backend itself imposes no
#     cap: it streams through connect-busboy with no `limits` configured.
#   * No TLS server block. Caddy on the waker terminates TLS, so the self-signed
#     cert upstream ships is neither needed nor wanted here.
#
# Everything else — the proxy locations, socket.io upgrade handling — is upstream's,
# kept byte-for-byte so this file stays easy to diff when upstream moves.

server {
    listen       80;
    server_name  _;

    ## Keep alive timeout set to a greater value for SSL/TLS.
    keepalive_timeout 75 75;

    # Uploads are multi-GB StrayScanner zips. 0 disables the check entirely;
    # the backend streams to disk, so nginx must not buffer or bound the body.
    client_max_body_size 0;
    proxy_request_buffering off;

    # A multi-GB upload over a slow link needs generous timeouts.
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    client_body_timeout   3600s;

    location / {
        root   /app;
        index  index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /socket.io/ {
        proxy_pass   http://backend:3000/socket.io/;
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /maps/ {
        proxy_pass   http://backend:3000/maps/;
        proxy_pass_request_headers on;
    }

    location /maps {
        proxy_pass   http://backend:3000/maps;
        proxy_pass_request_headers on;
    }

    location /uploadStrayRecordingZip {
        proxy_pass   http://backend:3000;
        proxy_pass_request_headers on;
    }

    location /auth/ {
        proxy_pass   http://backend:3000/auth/;
        proxy_set_header Host $http_host; # Correct hostname for Auth.JS callbacks
    }
}
